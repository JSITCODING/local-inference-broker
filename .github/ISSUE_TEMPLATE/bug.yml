name: Bug report
description: Report a reproducible problem without private content.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include prompts, responses, credentials, host details, or private data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [deterministic, ollama, not-provider-specific]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Use synthetic content only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
