<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Local Inference Broker architecture</title>
  <desc id="desc">A client sends a typed request to a loopback broker, which routes to a deterministic provider or local Ollama and returns one typed result.</desc>
  <rect width="1120" height="360" rx="22" fill="#F3F5F6"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="56" y="54" fill="#52606A" font-size="14" font-weight="700" letter-spacing="2.5">LOCAL TRUST BOUNDARY</text>
    <rect x="54" y="104" width="210" height="142" rx="16" fill="#FFFFFF" stroke="#CBD3D8" stroke-width="2"/>
    <text x="80" y="151" fill="#101B24" font-size="23" font-weight="700">Client</text>
    <text x="80" y="184" fill="#52606A" font-size="16">CLI or HTTP</text>
    <text x="80" y="217" fill="#52606A" font-size="14">typed request</text>
    <path d="M264 175h98" stroke="#315C78" stroke-width="6"/>
    <path d="m348 160 18 15-18 15" fill="none" stroke="#315C78" stroke-width="6"/>
    <rect x="370" y="78" width="350" height="194" rx="22" fill="#101B24"/>
    <text x="404" y="130" fill="#F7F6F2" font-size="25" font-weight="740">Local Inference Broker</text>
    <text x="404" y="171" fill="#AEB9C0" font-size="16">validate · route · measure</text>
    <path d="M404 187h102l40 26M404 213h142M404 239h102l40-26m0 0h140" fill="none" stroke="#F7F6F2" stroke-width="6"/>
    <rect x="537" y="204" width="18" height="18" rx="3" fill="#F0783E"/>
    <path d="M720 143h92" stroke="#315C78" stroke-width="6"/>
    <path d="m798 128 18 15-18 15" fill="none" stroke="#315C78" stroke-width="6"/>
    <path d="M720 217h92" stroke="#315C78" stroke-width="6"/>
    <path d="m798 202 18 15-18 15" fill="none" stroke="#315C78" stroke-width="6"/>
    <rect x="824" y="78" width="242" height="94" rx="16" fill="#FFFFFF" stroke="#CBD3D8" stroke-width="2"/>
    <text x="852" y="121" fill="#101B24" font-size="21" font-weight="700">Deterministic</text>
    <text x="852" y="147" fill="#52606A" font-size="14">test baseline</text>
    <rect x="824" y="188" width="242" height="94" rx="16" fill="#FFFFFF" stroke="#CBD3D8" stroke-width="2"/>
    <text x="852" y="231" fill="#101B24" font-size="21" font-weight="700">Local Ollama</text>
    <text x="852" y="257" fill="#52606A" font-size="14">optional provider</text>
    <text x="56" y="321" fill="#52606A" font-size="14">Default: 127.0.0.1 · No prompt persistence · Public internet excluded</text>
  </g>
</svg>
