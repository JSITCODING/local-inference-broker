<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Local Inference Broker social preview</title>
  <desc id="desc">Multiple context packets route through a local broker and leave as one structured result.</desc>
  <rect width="1280" height="640" fill="#101B24"/>
  <path d="M0 0h1280v640H0z" fill="url(#grid)" opacity=".18"/>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#93A2AC" stroke-width="1"/>
    </pattern>
  </defs>
  <g transform="translate(76 82)">
    <rect width="78" height="78" rx="18" fill="#172631"/>
    <path d="M14 23h15l10 16M14 39h25M14 55h15l10-16m0 0h25" fill="none" stroke="#F7F6F2" stroke-width="5.5"/>
    <rect x="34" y="34" width="10" height="10" rx="2" fill="#F0783E"/>
  </g>
  <text x="76" y="252" fill="#F7F6F2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="740" letter-spacing="-2.5">Keep routine inference close.</text>
  <text x="78" y="310" fill="#AEB9C0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="520">One typed contract for deterministic tools and local Ollama.</text>
  <g transform="translate(78 390)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <rect width="710" height="148" rx="18" fill="#172631" stroke="#31424D"/>
    <circle cx="28" cy="26" r="5" fill="#F0783E"/>
    <text x="50" y="32" fill="#D9E0E4">local-ai summarize --provider deterministic</text>
    <text x="28" y="78" fill="#7FC9B5">provider</text><text x="142" y="78" fill="#F7F6F2">deterministic</text>
    <text x="28" y="112" fill="#7FC9B5">persistence</text><text x="164" y="112" fill="#F7F6F2">none</text>
  </g>
  <g transform="translate(900 125)">
    <text x="0" y="0" fill="#93A2AC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3">LOCAL ROUTE</text>
    <path d="M0 70h82l48 92M0 162h130M0 254h82l48-92m0 0h130" fill="none" stroke="#F7F6F2" stroke-width="13" stroke-linecap="square" stroke-linejoin="round"/>
    <rect x="113" y="145" width="34" height="34" rx="6" fill="#F0783E"/>
    <text x="0" y="344" fill="#AEB9C0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" letter-spacing="2">PROTOTYPE v0.1</text>
  </g>
</svg>
